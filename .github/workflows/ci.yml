name: JeevanSetu CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # 1. Backend Verification & Automated Testing
  backend-test:
    name: Backend Tests & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Automated Test Suites (Phase 26 - Phase 31)
        run: |
          cd backend
          npm test

  # 2. Frontend Verification & Production Build
  frontend-build:
    name: Frontend Build & Static Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Smoke Tests
        run: |
          cd frontend
          npm test

      - name: Execute Next.js Production Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BACKEND_URL: http://localhost:5000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-key-placeholder

  # 3. Database Migration Safety & Determinism Audit
  migration-safety:
    name: Migration Ordering & Idempotency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Migration Ordering & Naming Integrity
        run: |
          echo "Auditing Supabase migrations..."
          files=$(ls -1 supabase/migrations/*.sql | sort)
          count=$(echo "$files" | wc -l)
          echo "Found $count migration files."
          if [ "$count" -lt 1 ]; then
            echo "Error: No migration files detected!"
            exit 1
          fi
          echo "All migrations sorted chronologically."

  # 4. Repository Secret Hygiene & Leak Prevention
  security-audit:
    name: Secret Isolation & Repository Hygiene Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify No Committed Secrets in Tracked Files
        run: |
          echo "Auditing for leaked production secrets..."
          if git grep -E "(SUPABASE_SERVICE_ROLE_KEY|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.)" -- ':!*.example' ':!*.md' ':!tests/*' ':!*.json'; then
            echo "Security Alert: Possible hardcoded secret found!"
            exit 1
          fi
          echo "✓ Repository clean: Zero committed production secrets."
