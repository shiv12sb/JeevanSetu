name: Build JeevanSetu Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK (Capacitor Native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses and Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js Production Web Bundle
        run: |
          cd frontend
          npm run build

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x frontend/android/gradlew

      - name: Sync Capacitor Android Project
        run: |
          cd frontend
          export CAPACITOR_TELEMETRY=false
          npx @capacitor/cli sync android || true

      - name: Build Debug APK with Gradle
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log || {
            echo "### ❌ Gradle Build Error Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Rename APK Output
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/JeevanSetu-v1.0.0.apk

      - name: Upload JeevanSetu APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JeevanSetu-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/JeevanSetu-v1.0.0.apk
          retention-days: 30
