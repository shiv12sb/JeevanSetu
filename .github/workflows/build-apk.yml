name: Build JeevanSetu Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK (Capacitor Native)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Configure Android SDK Environment
        run: |
          if [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
            echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          fi

      - name: Accept Licenses and Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js Production Web Bundle
        run: |
          cd frontend
          npm run build

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x frontend/android/gradlew

      - name: Sync Capacitor Android Project
        run: |
          cd frontend
          export CAPACITOR_TELEMETRY=false
          npx @capacitor/cli sync android || true

      - name: Build Debug APK with Gradle
        run: |
          cd frontend/android
          mkdir -p capacitor-cordova-android-plugins
          touch capacitor-cordova-android-plugins/cordova.variables.gradle
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename and Prepare APK Output
        run: |
          mkdir -p build-artifacts
          find frontend/android -name "*.apk" -exec cp -v {} build-artifacts/JeevanSetu-v1.0.0.apk \;
          ls -lh build-artifacts/
          if [ ! -f "build-artifacts/JeevanSetu-v1.0.0.apk" ]; then
            echo "❌ Fatal: No APK was produced by Gradle build!"
            exit 1
          fi

      - name: Upload JeevanSetu APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JeevanSetu-Android-APK
          path: build-artifacts/JeevanSetu-v1.0.0.apk
          retention-days: 30

      - name: Publish APK to Dedicated Direct-Download Branch
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-release
          git rm -rf . || true
          cp build-artifacts/JeevanSetu-v1.0.0.apk JeevanSetu.apk
          git add JeevanSetu.apk
          git commit -m "chore(release): publish latest JeevanSetu APK [skip ci]"
          git push -f origin apk-release

      - name: Output Direct Download URL to Step Summary
        run: |
          echo "## 📱 JeevanSetu Android APK Direct Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 [👉 Click Here to Download JeevanSetu APK](https://github.com/shiv12sb/JeevanSetu/raw/apk-release/JeevanSetu.apk)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Direct Download Link: https://github.com/shiv12sb/JeevanSetu/raw/apk-release/JeevanSetu.apk" >> $GITHUB_STEP_SUMMARY
