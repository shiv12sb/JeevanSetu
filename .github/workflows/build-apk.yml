name: Build JeevanSetu Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK (Capacitor Native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js Production Web Bundle
        run: |
          cd frontend
          npm run build

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x frontend/android/gradlew

      - name: Sync Capacitor Android Project
        run: |
          cd frontend
          export CAPACITOR_TELEMETRY=false
          npx @capacitor/cli sync android

      - name: Build Debug APK with Gradle
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK Output
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/JeevanSetu-v1.0.0.apk

      - name: Upload JeevanSetu APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JeevanSetu-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/JeevanSetu-v1.0.0.apk
          retention-days: 30
