name: Build JeevanSetu Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK (Capacitor Native)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Configure Android SDK Environment
        run: |
          if [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
            echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          fi

      - name: Accept Licenses and Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js Production Web Bundle
        run: |
          cd frontend
          npm run build

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x frontend/android/gradlew

      - name: Sync Capacitor Android Project
        run: |
          cd frontend
          export CAPACITOR_TELEMETRY=false
          npx @capacitor/cli sync android || true

      - name: Build Debug APK with Gradle
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log || {
            echo "### ❌ Gradle Build Error Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Rename and Prepare APK Output
        run: |
          mkdir -p build-artifacts
          find frontend/android -name "*.apk" -exec cp -v {} build-artifacts/JeevanSetu-v1.0.0.apk \;
          ls -lh build-artifacts/

      - name: Upload JeevanSetu APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JeevanSetu-Android-APK
          path: build-artifacts/JeevanSetu-v1.0.0.apk
          retention-days: 30

      - name: Generate Direct Public 1-Click APK Download Links
        run: |
          # 1. Upload to tmpfiles.org for direct phone download
          RESP=$(curl -s -F "file=@build-artifacts/JeevanSetu-v1.0.0.apk" https://tmpfiles.org/api/v1/upload)
          RAW_URL=$(echo $RESP | jq -r '.data.url // empty')
          if [ -n "$RAW_URL" ]; then
            DIRECT_URL=$(echo $RAW_URL | sed 's/tmpfiles.org\//tmpfiles.org\/dl\//')
          else
            DIRECT_URL="https://github.com/shiv12sb/JeevanSetu/actions"
          fi
          
          # 2. Upload to file.io as secondary direct mirror
          FILEIO_RESP=$(curl -s -F "file=@build-artifacts/JeevanSetu-v1.0.0.apk" https://file.io || true)
          FILEIO_LINK=$(echo $FILEIO_RESP | jq -r '.link // empty')

          echo "=========================================================="
          echo "📱 DIRECT APK DOWNLOAD LINK (1-CLICK PHONE DOWNLOAD):"
          echo "$DIRECT_URL"
          echo "Secondary link: $FILEIO_LINK"
          echo "=========================================================="

          # Output to GitHub Action Step Summary (Renders clearly on GitHub Web UI)
          echo "## 📱 JeevanSetu Android APK Direct Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 [👉 Click Here to Download JeevanSetu APK Directly]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download (1-Click, No Login Needed):** $DIRECT_URL" >> $GITHUB_STEP_SUMMARY
          if [ -n "$FILEIO_LINK" ]; then
            echo "- **Backup Direct Download:** $FILEIO_LINK" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish APK to GitHub Release via GitHub CLI
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          gh release create v1.0.0-apk build-artifacts/JeevanSetu-v1.0.0.apk \
            --repo shiv12sb/JeevanSetu \
            --title "JeevanSetu Android APK v1.0.0" \
            --notes "Official JeevanSetu Android Native Application (.apk) for Maharashtra rural healthcare." \
            --target main || echo "::warning::Release upload requires 'Read and write permissions' enabled in repo Settings > Actions > General > Workflow permissions."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
