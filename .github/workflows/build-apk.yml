name: Build JeevanSetu Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK (Capacitor Native)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Configure Android SDK Environment
        run: |
          if [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
            echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          fi

      - name: Accept Licenses and Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js Production Web Bundle
        run: |
          cd frontend
          npm run build

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x frontend/android/gradlew

      - name: Sync and Bundle Web Assets into Android Project
        run: |
          cd frontend
          export CAPACITOR_TELEMETRY=false
          npx @capacitor/cli sync android || true
          mkdir -p android/app/src/main/assets/public
          cp -r out/* android/app/src/main/assets/public/
          rm -f android/app/src/main/assets/public/*.apk
          echo "Verifying assets directory before build:"
          ls -lh android/app/src/main/assets/public/

      - name: Build Debug APK with Gradle
        run: |
          cd frontend/android
          mkdir -p capacitor-cordova-android-plugins
          touch capacitor-cordova-android-plugins/cordova.variables.gradle
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename and Prepare APK Output
        run: |
          mkdir -p build-artifacts
          find frontend/android -name "*.apk" -exec cp -v {} build-artifacts/JeevanSetu-v1.0.0.apk \;
          ls -lh build-artifacts/
          if [ ! -f "build-artifacts/JeevanSetu-v1.0.0.apk" ]; then
            echo "❌ Fatal: No APK was produced by Gradle build!"
            exit 1
          fi
          echo "Verifying assets packed inside APK:"
          jar tf build-artifacts/JeevanSetu-v1.0.0.apk | grep "assets/public/login/index.html" || {
            echo "❌ Fatal: assets/public/login/index.html missing from APK!"
            exit 1
          }
          echo "✅ Confirmed: full Next.js site (login, dashboard, all routes) packed inside JeevanSetu APK!"

      - name: Upload JeevanSetu APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JeevanSetu-Android-APK
          path: build-artifacts/JeevanSetu-v1.0.0.apk
          retention-days: 30

      - name: Upload to Instant Download Mirror
        id: upload-mirror
        run: |
          UPLOAD_RES=$(curl -s -F "file=@build-artifacts/JeevanSetu-v1.0.0.apk" https://tmpfiles.org/api/v1/upload || echo "{}")
          echo "UPLOAD_RES: $UPLOAD_RES"
          TMP_URL=$(echo "$UPLOAD_RES" | grep -o 'https://tmpfiles.org/[0-9a-zA-Z/]*' | head -n 1 || echo "")
          if [ -n "$TMP_URL" ]; then
            DL_URL=$(echo "$TMP_URL" | sed 's|tmpfiles.org/|tmpfiles.org/dl/|')
            echo "MIRROR_URL=$DL_URL" >> $GITHUB_ENV
            echo "Mirror download: $DL_URL"
          fi

      - name: Commit and Push Updated APK to Repository
        run: |
          mkdir -p frontend/public
          cp -fv build-artifacts/JeevanSetu-v1.0.0.apk frontend/public/JeevanSetu.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/JeevanSetu.apk
          git commit -m "chore(release): update JeevanSetu production APK binary [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Git push skipped"

      - name: Output Direct Download URL to Step Summary
        run: |
          echo "## 📱 JeevanSetu Android APK Direct Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 [👉 Download JeevanSetu APK from Repository](https://github.com/shiv12sb/JeevanSetu/raw/main/frontend/public/JeevanSetu.apk)" >> $GITHUB_STEP_SUMMARY
          if [ -n "$MIRROR_URL" ]; then
            echo "### ⚡ [👉 High-Speed Mirror Link]($MIRROR_URL)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Direct GitHub Link: https://github.com/shiv12sb/JeevanSetu/raw/main/frontend/public/JeevanSetu.apk" >> $GITHUB_STEP_SUMMARY
