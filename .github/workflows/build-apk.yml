name: Build JeevanSetu Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK (Capacitor Native)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses and Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js Production Web Bundle
        run: |
          cd frontend
          npm run build

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x frontend/android/gradlew

      - name: Sync Capacitor Android Project
        run: |
          cd frontend
          export CAPACITOR_TELEMETRY=false
          npx @capacitor/cli sync android || true

      - name: Build Debug APK with Gradle
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log || {
            echo "### ❌ Gradle Build Error Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Rename and Prepare APK Output
        run: |
          mkdir -p build-artifacts
          find frontend/android -name "*.apk" -exec cp -v {} build-artifacts/JeevanSetu-v1.0.0.apk \;
          ls -lh build-artifacts/

      - name: Upload JeevanSetu APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JeevanSetu-Android-APK
          path: build-artifacts/JeevanSetu-v1.0.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "JeevanSetu Android APK v1.0.0"
          body: |
            ## 📱 JeevanSetu Native Android Application (APK v1.0.0)

            Direct Android Application Package (.apk) compiled natively with Capacitor 8 and Android SDK 36 for rural healthcare access across Maharashtra.

            ### ✨ Key Features Included:
            - 🚑 **Emergency 108 Ambulance Dispatch** with live GPS telematics
            - 👨‍⚕️ **Verified Doctor Directory** with MMC registration checks
            - 🗣️ **Multilingual AI Voice Assistant** (Marathi, Hindi, English)
            - 🏥 **PHC Medicine Stock & Referral Tracking**
            - 💳 **ABHA ID & PM-JAY Digital Health Records**

            ### 📥 Download & Installation Guide:
            1. Download **`JeevanSetu-v1.0.0.apk`** below directly to your phone.
            2. Tap the downloaded file in your Notification Bar or Downloads folder.
            3. Tap **Install** (if prompted, enable *Allow from this source* in Android Settings).
            4. Launch **JeevanSetu** from your home screen or app drawer!
          files: build-artifacts/JeevanSetu-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
