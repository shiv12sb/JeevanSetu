# ==============================================================================
# JEEVANSETU LOCAL ORCHESTRATION (DOCKER COMPOSE)
# ==============================================================================
# Optional containerized stack for local development, staging tests, or air-gapped demo

version: "3.8"

services:
  # 1. JeevanSetu Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jeevansetu-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - APP_ENV=development
      - FRONTEND_URL=http://localhost:3000
      - MOCK_PROVIDERS=true
      - N8N_ENABLED=false
      - ENABLE_BACKGROUND_JOBS=true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - jeevansetu-net

  # 2. JeevanSetu Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jeevansetu-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:5000
      - NEXT_PUBLIC_APP_ENV=development
    depends_on:
      - backend
    networks:
      - jeevansetu-net

networks:
  jeevansetu-net:
    driver: bridge
